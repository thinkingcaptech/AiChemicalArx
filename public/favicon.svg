<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1625"/>
      <stop offset="100%" style="stop-color:#0d0a14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
    <linearGradient id="elixirGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b68ee"/>
      <stop offset="100%" style="stop-color:#663399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  
  <!-- Outer Alchemical Circle -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#elixirGrad)" stroke-width="2" opacity="0.5"/>
  
  <!-- Inner Triangle (Alchemical Symbol) -->
  <polygon points="256,80 380,340 132,340" fill="none" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Inverted Triangle -->
  <polygon points="256,380 160,180 352,180" fill="none" stroke="url(#elixirGrad)" stroke-width="2" opacity="0.6"/>
  
  <!-- Center Circle with AI Symbol -->
  <circle cx="256" cy="256" r="60" fill="url(#elixirGrad)" opacity="0.3"/>
  <circle cx="256" cy="256" r="45" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- AI/Brain Symbol in Center -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Neural nodes -->
    <circle cx="0" cy="-20" r="8" fill="url(#goldGrad)"/>
    <circle cx="-17" cy="10" r="8" fill="url(#goldGrad)"/>
    <circle cx="17" cy="10" r="8" fill="url(#goldGrad)"/>
    
    <!-- Connections -->
    <line x1="0" y1="-12" x2="-12" y2="5" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="0" y1="-12" x2="12" y2="5" stroke="url(#goldGrad)" stroke-width="2"/>
    <line x1="-9" y1="10" x2="9" y2="10" stroke="url(#goldGrad)" stroke-width="2"/>
  </g>
  
  <!-- Decorative Stars -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <circle cx="256" cy="50" r="4"/>
    <circle cx="440" cy="200" r="3"/>
    <circle cx="440" cy="320" r="3"/>
    <circle cx="72" cy="200" r="3"/>
    <circle cx="72" cy="320" r="3"/>
    <circle cx="180" cy="420" r="4"/>
    <circle cx="332" cy="420" r="4"/>
  </g>
</svg>